name: Cargo fork
description: Replaces the rustup cargo proxy on a Windows or Apple Silicon runner with huacnlee/cargo.

# CI pins one release by its checksums. To update, change all three values.
# The checksums are in SHA256SUMS of the release.
inputs:
  version:
    description: Release of huacnlee/cargo
    default: 0.102.0-9
  windows-sha256:
    description: SHA-256 of the x86_64-pc-windows-msvc zip of that release
    default: 79fce48a68e86857b04c45b77157215da006d0333dc16234891aa10e930bd42c
  macos-sha256:
    description: SHA-256 of the aarch64-apple-darwin archive of that release
    default: 6a6371f2c8988b8ee2965867145a03f0481881c702c05fb429a5f67d1e0998bb

runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        FORK_VERSION: ${{ inputs.version }}
        FORK_SHA256: ${{ inputs.windows-sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $asset = "cargo-$env:FORK_VERSION-x86_64-pc-windows-msvc.zip"
        $zip = Join-Path $env:RUNNER_TEMP $asset
        Invoke-WebRequest "https://github.com/huacnlee/cargo/releases/download/v$env:FORK_VERSION/$asset" -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ine $env:FORK_SHA256) { throw "Checksum mismatch for $asset" }
        $unpacked = Join-Path $env:RUNNER_TEMP 'cargo-fork'
        Expand-Archive -LiteralPath $zip -DestinationPath $unpacked
        $proxy = (Get-Command cargo).Source
        Copy-Item -LiteralPath $proxy -Destination (Join-Path (Split-Path $proxy) 'cargo.rustup.exe')
        Move-Item -LiteralPath (Join-Path $unpacked 'cargo.exe') -Destination $proxy -Force
        $version = cargo --version
        Write-Output $version
        if ($version -notmatch 'huacnlee/cargo') { throw 'cargo is not the fork' }
    - if: runner.os == 'macOS'
      shell: bash
      env:
        FORK_VERSION: ${{ inputs.version }}
        FORK_SHA256: ${{ inputs.macos-sha256 }}
      run: |
        set -euo pipefail
        asset="cargo-$FORK_VERSION-aarch64-apple-darwin.tar.gz"
        archive="$RUNNER_TEMP/$asset"
        curl -fsSL "https://github.com/huacnlee/cargo/releases/download/v$FORK_VERSION/$asset" -o "$archive"
        echo "$FORK_SHA256  $archive" | shasum -a 256 -c -
        unpacked="$RUNNER_TEMP/cargo-fork"
        mkdir -p "$unpacked"
        tar -xzf "$archive" -C "$unpacked"
        proxy="$(command -v cargo)"
        cp -pL "$proxy" "$proxy.rustup"
        mv -f "$unpacked/cargo" "$proxy"
        version="$(cargo --version)"
        echo "$version"
        case "$version" in
          *huacnlee/cargo*) ;;
          *) echo "cargo is not the fork" >&2; exit 1 ;;
        esac
