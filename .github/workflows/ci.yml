name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/cargo-fork
      - uses: Swatinem/rust-cache@v2
        with:
          # The fork keeps intermediate files here, not in ./target.
          cache-directories: ~/.cargo/targets
      - name: No word lists
        shell: bash
        # Speech to text decodes with the model alone (AGENTS.md). Text to
        # speech (src/tts) may hold lists: text normalization and the lexicon.
        # src/gpu holds shader code, not words.
        run: |
          if git grep -n 'include_str!' -- src ffi ':!src/tts' ':!src/gpu' \
            || git ls-files -- src ':!src/tts' | grep -E '\.(txt|json|csv|tsv)$'; then
            echo "error: a word list ships in the speech-to-text engine; it decodes with the model alone"
            exit 1
          fi
      - name: C ABI
        shell: bash
        # include/trit.h and the bindings are written by hand. The header
        # names every export; a binding names only exports.
        run: |
          exports=$(grep -A1 'no_mangle' ffi/src/lib.rs | grep -o 'trit_[a-z0-9_]*' | sort -u)
          header=$(grep -o '\btrit_[a-z0-9_]*(' include/trit.h | tr -d '(' | sort -u)
          bindings=$(grep -ohw 'trit_[a-z0-9_]*' bindings/python/trit.py bindings/csharp/Trit.cs bindings/node/trit.mjs | grep -v '^trit_ffi$' | sort -u)
          if [ "$exports" != "$header" ] || [ -n "$(comm -13 <(echo "$exports") <(echo "$bindings"))" ]; then
            diff <(echo "$exports") <(echo "$header")
            comm -13 <(echo "$exports") <(echo "$bindings")
            echo "error: include/trit.h or a binding does not match ffi/src/lib.rs"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --release --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Skill
        run: target/release/trit.exe skill --check skill/SKILL.md

  # Apple Silicon: the NEON, sdot, and smmla kernels, the macOS thread
  # setup, and the Metal GPU code. The home view prints the kernel paths.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/cargo-fork
      - uses: Swatinem/rust-cache@v2
        with:
          # The fork keeps intermediate files here, not in ./target.
          cache-directories: ~/.cargo/targets
      - name: Build
        run: cargo build --locked --release --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Kernel paths
        run: target/release/trit
