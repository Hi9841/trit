[package]
name = "trit"
version = "0.12.0"
edition = "2021"
description = "Speech to text and text to speech on the CPU: Parakeet, Whisper, Canary, Moonshine, Kokoro, and MMS-TTS, with no Python and no inference library"
license = "AGPL-3.0-only"
repository = "https://github.com/Hi9841/trit"
readme = "README.md"
keywords = ["speech-to-text", "text-to-speech", "asr", "tts", "offline"]
categories = ["multimedia::audio", "science"]

[workspace]
members = [".", "ffi"]

[[bin]]
name = "trit"
path = "src/main.rs"

[features]
# Matrix products and the Parakeet encoder on a GPU (Vulkan, DX12, or Metal). Off by default.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Stage timers and counters (`src/prof.rs`); `trit transcribe` prints them on stderr. Off by default: no cost.
profile = []

[dependencies]
parking_lot = "0.12"
serde_json = "1.0"
# zlib, for the compression ratio of Whisper's temperature fallback (as OpenAI computes it).
miniz_oxide = "0.8"
mimalloc = { version = "0.1", default-features = false }
# mi_collect: give the memory freed while loading back to the system.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# Any 0.62: wgpu-hal wants ^0.62 and gpu-allocator 0.28 accepts
# ">=0.53, <=0.62", which Cargo reads as below 0.63, so one 0.62 patch
# serves all three. No exact pin: it would bind every host too.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# mmap of the weight cache (`src/cpu/store.rs`).
libc = "0.2"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
# The library does not print: a host with no console loses the text. The
# messages go through `trit::log`; the CLI allows stdout for itself.
print_stderr = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
