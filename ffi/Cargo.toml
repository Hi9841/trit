[package]
name = "trit-ffi"
version = "0.1.0"
edition = "2021"
description = "The C ABI of Trit (include/trit.h), for Python, C#, Node, Go, and any language with a C FFI"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Hi9841/tdt"

[lib]
name = "trit_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
trit = { path = ".." }
mimalloc = { version = "0.1", default-features = false }
